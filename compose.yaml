volumes:
  traefik-acme:
    name: traefik-acme

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/traefik.generated.yaml:/etc/traefik/traefik.yaml:ro
      - traefik-acme:/letsencrypt
    ports:
      - "${PORT:-9001}:443"
      - "443:443"
      - "127.0.0.1:8080:8080"
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      autoheal: "true"

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: ghcr.io/${DOCKER_IMAGE_OWNER:-ofcoliva}/login-frontend:dev
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      replicas: 2
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.frontend.rule: "Host(`${DOMAIN:-localhost}`)"
      traefik.http.routers.frontend.entrypoints: websecure
      traefik.http.routers.frontend.service: frontend
      traefik.http.routers.frontend.tls.certresolver: letsencrypt
      traefik.http.routers.frontend.middlewares: frontend-ratelimit,frontend-secureheaders
      traefik.http.routers.frontend-http.rule: "Host(`${DOMAIN:-localhost}`)"
      traefik.http.routers.frontend-http.entrypoints: web
      traefik.http.routers.frontend-http.middlewares: redirect-to-https
      traefik.http.routers.frontend-local.rule: "Host(`localhost`) || Host(`127.0.0.1`)"
      traefik.http.routers.frontend-local.entrypoints: web
      traefik.http.routers.frontend-local.service: frontend
      traefik.http.routers.frontend-local.middlewares: frontend-ratelimit,frontend-secureheaders
      traefik.http.routers.frontend-local-secure.rule: "Host(`localhost`) || Host(`127.0.0.1`)"
      traefik.http.routers.frontend-local-secure.entrypoints: websecure
      traefik.http.routers.frontend-local-secure.service: frontend
      traefik.http.routers.frontend-local-secure.tls.certresolver: none
      traefik.http.routers.frontend-local-secure.middlewares: frontend-ratelimit,frontend-secureheaders
      traefik.http.services.frontend.loadbalancer.server.port: "8080"
      traefik.http.middlewares.frontend-ratelimit.rateLimit.average: "100"
      traefik.http.middlewares.frontend-ratelimit.rateLimit.burst: "50"
      traefik.http.middlewares.frontend-secureheaders.headers.frameDeny: "true"
      traefik.http.middlewares.redirect-to-https.redirectscheme.scheme: https

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_INTERVAL=5
      - AUTOHEAL_START_PERIOD=300
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCHEDULE: "0 3 * * *"
      DOCKER_API_VERSION: 1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      autoheal: "true"

networks:
  edge:
    name: login-frontend-edge
  internal:
    name: login-frontend-internal


