name: login-frontend

services:
  traefik:
    image: traefik:v3.4
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - traefik-acme:/letsencrypt
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@exemplo.com}
      ACME_CA_SERVER: ${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      autoheal: "true"

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: ghcr.io/${DOCKER_IMAGE_OWNER:-ofcoliva}/login-frontend:dev
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    deploy:
      replicas: 2
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.frontend.rule: "Host(`${DOMAIN:-localhost}`)"
      traefik.http.routers.frontend.entrypoints: web
      traefik.http.routers.frontend.service: frontend
      traefik.http.routers.frontend.middlewares: frontend-ratelimit,frontend-secureheaders
      traefik.http.services.frontend.loadbalancer.server.port: "8080"
      traefik.http.middlewares.frontend-ratelimit.rateLimit.average: "100"
      traefik.http.middlewares.frontend-ratelimit.rateLimit.burst: "50"
      traefik.http.middlewares.frontend-secureheaders.headers.frameDeny: "true"

  autoheal:
    image: willfarrell/autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_INTERVAL=5
      - AUTOHEAL_START_PERIOD=300
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCHEDULE: "0 3 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      autoheal: "true"

